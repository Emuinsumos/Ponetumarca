function resizeImagen(file, callback, maxSize = 900) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
      else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

}

                <div className="text-center">

                  <p className="text-lg font-bold text-cafe-900 mb-6">Conectado como Administrador</p>
                  <button onClick={() => alert("El panel completo de edición va aquí")} className="w-full bg-bronce-500 text-cafe-900 font-bold py-3 rounded-lg mb-3">Ir al Dashboard</button>
                  <button onClick={() => setIsAdmin(false)} className="text-cafe-500 underline text-sm hover:text-vino-600">Cerrar Sesión</button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
